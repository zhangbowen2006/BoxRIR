<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>BoxRIR · 多声源同步录音</title>
  <style>
    :root {
      font-family: system-ui, "Microsoft YaHei", sans-serif;
      color: #152e40;
      background: #f3f7f8;
    }
    * { box-sizing: border-box }
    body { margin: 0 }
    main { max-width: 1180px; margin: auto; padding: 38px 24px }
    header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 24px;
    }
    h1 { font-size: clamp(26px, 4vw, 42px); line-height: 1.2; margin: 0 }
    h2 { font-size: 19px; margin: 0 0 14px }
    h3 { font-size: 15px; margin: 18px 0 8px }
    a { color: #087e8b }
    .grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 22px }
    .card {
      min-width: 0;
      background: #fff;
      border: 1px solid #dce6ea;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 30px #16324705;
    }
    .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap }
    .note { color: #526b79; font-size: 13px; line-height: 1.65; margin: 8px 0 14px }
    label { display: block; font-size: 13px; font-weight: 600; margin: 12px 0 5px }
    textarea, input[type="file"] {
      width: 100%;
      min-width: 0;
      color: #173547;
      background: #fff;
      border: 1px solid #b8ccd4;
      border-radius: 7px;
      padding: 8px;
      font: inherit;
    }
    textarea { min-height: 275px; resize: vertical; font: 13px/1.5 ui-monospace, Consolas, monospace }
    button, .download {
      display: inline-block;
      padding: 10px 13px;
      border: 0;
      border-radius: 8px;
      background: #087e8b;
      color: white;
      font: inherit;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
    }
    button:disabled { opacity: .5; cursor: default }
    .secondary, .download { background: #e5eff1; color: #075e68 }
    .track + .track { border-top: 1px solid #e5edef; margin-top: 10px }
    .track-description { overflow-wrap: anywhere }
    .track-description .note { margin: 7px 0 }
    .track-description button { padding: 5px 8px; font-size: 12px }
    #status { font-size: 13px; line-height: 1.65; overflow-wrap: anywhere }
    #status.error { color: #b42318 }
    audio { width: 100%; margin: 4px 0 10px }
    .stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin: 0 0 15px;
    }
    .stats div { border-radius: 8px; padding: 12px 8px; background: #eff6f7 }
    .stats dt { color: #526b79; font-size: 12px }
    .stats dd { margin: 2px 0 0; color: #087e8b; font-weight: 700; overflow-wrap: anywhere }
    .table-scroll { width: 100%; overflow-x: auto; margin: 10px 0 }
    table { border-collapse: collapse; width: 100%; font-size: 13px }
    th, td { border-bottom: 1px solid #e5edef; text-align: left; padding: 8px; white-space: nowrap }
    .download { margin-bottom: 8px }
    [hidden] { display: none !important }
    @media (max-width: 800px) {
      .grid { grid-template-columns: minmax(0, 1fr) }
      main { padding: 22px 14px }
      header { align-items: center }
      .card { padding: 17px }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>BoxRIR 多声源录音</h1>
      <a href="./">单声源工作台</a>
    </header>
    <div class="grid">
      <section class="card" aria-labelledby="input-title">
        <h2 id="input-title">设置房间和轨道</h2>
        <div class="row">
          <button id="preset" type="button" class="secondary">恢复双声源示例</button>
        </div>
        <label for="scene">录音参数 JSON</label>
        <textarea id="scene" spellcheck="false" aria-describedby="scene-help"></textarea>
        <p id="scene-help" class="note">1–4 个静态声源共用房间和接收点。位置单位为米，start_frame 为从 0 开始的录音采样点，gain 为线性增益。</p>
        <h3>为轨道选择本地 WAV</h3>
        <p class="note">请使用与场景采样率一致的单声道 WAV。空着的轨道会使用相同采样率的合成音，文件只在本浏览器处理。</p>
        <div id="track-files"></div>
        <div class="row">
          <button id="run" type="button">生成混音</button>
          <button id="cancel" type="button" class="secondary" disabled>取消计算</button>
        </div>
        <p id="status" role="status" aria-live="polite"></p>
      </section>
      <section class="card" aria-labelledby="output-title">
        <h2 id="output-title">录音与轨道时间轴</h2>
        <p id="empty" class="note">点击「生成混音」试听双声源示例。</p>
        <div id="results" hidden>
          <dl class="stats">
            <div><dt>采样率</dt><dd id="rate"></dd></div>
            <div><dt>同步通道</dt><dd id="channels"></dd></div>
            <div><dt>总帧数</dt><dd id="frames"></dd></div>
          </dl>
          <audio id="wet-player" controls preload="metadata" aria-label="同步混音试听"></audio>
          <div id="downloads" class="row"></div>
          <div class="table-scroll" tabindex="0" aria-label="轨道时间轴，可横向滚动">
            <table>
              <thead><tr><th scope="col">轨道</th><th scope="col">起点（帧）</th><th scope="col">终点（不含）</th><th scope="col">滤波延迟（帧）</th></tr></thead>
              <tbody id="track-report"></tbody>
            </table>
          </div>
          <p class="note">播放和下载均使用原始混音增益。浏览器可能下混多声道音频，通道顺序以 WAV 为准。</p>
        </div>
      </section>
    </div>
  </main>
  <script type="module" src="./mix.mjs"></script>
</body>
</html>
