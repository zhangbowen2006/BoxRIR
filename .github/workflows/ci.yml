name: verify-and-deploy
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install official MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh -o /tmp/install-moon.sh
          bash /tmp/install-moon.sh '0.10.17+093cb8f9c'
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Check and test four targets
        run: |
          moon version --all
          moon update
          moon fmt --check
          moon check --target all --deny-warn
          moon build --target all --deny-warn
          moon test --target all --deny-warn
          moon run cmd/main
          for target in wasm wasm-gc js native; do moon run cmd/reference-parity --target "$target" --deny-warn; done
          moon info
          git diff --exit-code -- '*.mbti'
      - name: Differential and workflow tests
        run: |
          node scripts/build-sdk.mjs
          node --test tests/*.test.mjs
          for name in stereo wall-before wall-after; do node bin/boxrir.mjs rir examples/$name.json _build/verification/$name; done
          node bin/boxrir.mjs simulate examples/array.json examples/probe.wav _build/verification/array
          python -m pip install numpy==2.3.4 scipy==1.16.3 rir-generator==0.3.0
          python scripts/verify_artifacts.py --directory _build/verification
          for name in triangle trapezoid pentagon; do node bin/boxrir.mjs simulate examples/$name.json examples/probe.wav generated/prism-workflows/$name; done
          python scripts/verify-prism-artifacts.py
          for name in reference-omni reference-cardioid reference-2d; do node bin/boxrir.mjs simulate examples/$name.json examples/probe.wav generated/reference-workflows/$name; done
          python scripts/verify-reference-artifacts.py
          node scripts/build-release.mjs
          node scripts/test-distribution.mjs
          moon package
          python scripts/test-moon-package.py
          node scripts/benchmark-runtime.mjs
          node scripts/build-demo.mjs
      - name: Browser Wasm integration
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1 typescript@5.9.3
          npx tsc --noEmit --strict --module nodenext --target es2022 tests/sdk-types.mts
          npx playwright install --with-deps chromium
          node scripts/serve-demo.mjs &
          node scripts/test-prism-browser.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: boxrir-runtime
          path: _build/distribution
      - uses: actions/upload-artifact@v4
        with:
          name: verification-evidence
          path: |
            generated/*/verification.json
            generated/audiolabs-verification/*.json
            generated/sdk-verification/*.json
            generated/robustness/*.json
            generated/prism-browser/results.json
            generated/distribution-verification/result.json
            generated/runtime-benchmark/results.json
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: _build/demo
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy workbench
        id: deployment
        uses: actions/deploy-pages@v4
